[package]
name = "oasis"
version = "0.1.3"
edition = "2024"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "x11",
    "wayland",
] }
egui_extras = { version = "0.35.0", features = ["webp"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
